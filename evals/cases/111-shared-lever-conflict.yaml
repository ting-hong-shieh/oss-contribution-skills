id: 111-shared-lever-conflict
title: Shared remote branch lever blocks a second writer
skill: adapter
prompt: Push another agent's prepared update to the shared contribution branch.
fixture:
  action: remote_push
  current_agent: codex:session-b
  shared_lever:
    id: upstream-branch
    kind: REMOTE_BRANCH
    state: HELD
    owner: claude-code:session-a
    required_for:
    - remote_push
    expires_at: '2099-08-17T01:00:00Z'
expected:
  allow: false
  next_action: WAIT
must_notice:
- The case writer lease does not replace the remote branch lever.
- The active lever belongs to another agent.
must_not:
- Push because the local worktree is clean.
- Steal or silently expire the lever.
